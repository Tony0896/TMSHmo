<!--suppress JSAnnotator -->
<template>
    <div class="page">
        <nav class="left top-left" style="justify-content: space-between">
            <a href="javascript:location.reload()" style="margin-left: 10px; display: inline-flex; align-items: center">
                <i class="icon material-icons md-only" style="font-weight: 900; font-size: 30px">arrow_back</i>
            </a>
            <div class="title">Revisión de Imagen</div>
            <a style="margin-right: 10px">
                <i class="icon material-icons md-only" style="color: #1e9fb4; font-weight: 900">arrow_back</i>
            </a>
        </nav>
        <div class="toolbar tabbar toolbar-bottom">
            <div class="toolbar-inner" style="background-color: #1e9fb4">
                <a
                    href="#"
                    onclick="IniciaSiniestros();"
                    style="margin: auto; color: #fff; font-weight: bold; font-size: 18px; width: 100%; text-align: center"
                    >Iniciar <i class="icon material-icons md-only" style="display: inline-block">chevron_right</i></a
                >
            </div>
        </div>
        <div class="page-content">
            <div style="text-align: center; justify-content: center; margin-right: auto; margin-left: auto; width: 99%; margin-top: 50px">
                <div class="list" id="demo-form">
                    <div class="list no-hairlines-md">
                        <div class="list FWM-fixing-form">
                            <span class="span FWM-span-form">Unidad</span>
                            <input
                                type="text"
                                placeholder="Escribe el No. de la unidad"
                                id="unidad"
                                class="FWM-input autocomplete-dropdown item-title"
                            />
                            <span class="span FWM-span-form">Chasis</span>
                            <input class="FWM-input" type="text" id="Chasis" readonly />
                            <span class="span FWM-span-form">Formato asignado</span>
                            <input class="FWM-input" type="text" id="formato" readonly />
                            <span class="span FWM-span-form">Fecha de revisión</span>
                            <input class="FWM-input" type="date" id="fecha_revision" readonly />

                            <input type="hidden" id="id_unidad" />
                            <input type="hidden" id="modelo_check" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
<script>
    return {
        on: {
            pageInit: function () {
                let empresa = localStorage.getItem("empresa");
                let self = this;
                let app = self.$app;
                let NomJson = "Unidades_empresa" + empresa;
                let NomDescCli = "Unidades_empresa" + empresa;

                let fecha = new Date();
                let mes = fecha.getMonth() + 1;
                let day = fecha.getDate();

                if (mes < 10 && mes >= 0) {
                    mes = "0" + mes;
                }
                if (day < 10 && day >= 0) {
                    day = "0" + day;
                }

                let fecha_revision = fecha.getFullYear() + "-" + mes + "-" + day;

                $("#fecha_revision").val(fecha_revision);

                self.autocompleteDropdownAjax = app.autocomplete.create({
                    inputEl: "#unidad",
                    openIn: "dropdown",
                    preloader: true, //enable preloader
                    valueProperty: "id_unidad", //object's "value" property name
                    textProperty: "buscador", //object's "text" property name
                    limit: 10, //limit to [number] results
                    dropdownPlaceholderText: "Selecciona una Unidad...",
                    source: function (query, render) {
                        let autocomplete = this;
                        let results = [];
                        if (query.length === 0) {
                            render(results);
                            return;
                        }
                        autocomplete.preloaderShow();
                        app.request({
                            url: cordova.file.dataDirectory + "jsons_Siniestros/" + NomJson + ".json",
                            method: "GET",
                            dataType: "json",
                            data: {
                                query: query,
                            },
                            success: function (data) {
                                for (let i = 0; i < data.length; i++) {
                                    if (data[i].buscador.toLowerCase().indexOf(query.toLowerCase()) >= 0) results.push(data[i]);
                                }
                                autocomplete.preloaderHide();
                                render(results);
                            },
                        });
                    },
                });

                $("#unidad").change(function () {
                    let unidad = $("#unidad").val();
                    let encontro = false;
                    app.request.get(cordova.file.dataDirectory + "jsons_Siniestros/" + NomDescCli + ".json", function (data) {
                        let content2 = JSON.parse(data);
                        for (let x = 0; x < content2.length; x++) {
                            if (content2[x].id_unidad == unidad) {
                                $("#unidad").val(content2[x].Unidad);
                                $("#Chasis").val(content2[x].Modelo);
                                $("#id_unidad").val(content2[x].id_unidad);
                                encontro = true;
                            }
                        }
                        if (!encontro) {
                            $("#unidad").val("");
                            $("#Chasis").val("");
                            $("#id_unidad").val("");
                        }
                        validarFomratSiniestros($("#Chasis").val());
                    });
                });

                function validarFomratSiniestros(valorSiniestros) {
                    let encontro = false;
                    let NomDescCli1 = "Formatos_" + empresa;
                    app.request.get(cordova.file.dataDirectory + "jsons_Siniestros/" + NomDescCli1 + ".json", function (data) {
                        let content2 = JSON.parse(data);
                        for (let x = 0; x < content2.length; x++) {
                            if (content2[x].Chasis == valorSiniestros) {
                                $("#formato").val(content2[x].NombreFormato);
                                $("#modelo_check").val(content2[x].FK_formato);
                                encontro = true;
                            }
                        }
                        if (!encontro) {
                            $("#formato").val("");
                            $("#modelo_check").val("");
                        }
                    });
                }
            },
        },
    };
</script>
