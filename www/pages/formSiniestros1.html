                let Chasis = localStorage.getItem("ChasisUnidad");
                let encontro = false;
                let encontro2 = false;
                let empresa = localStorage.getItem("empresa");
                let optionsVistas = '<option value="" selected disabled>Selecciona una opción</option>';
                var zoomist = "";

                app.request.get(cordova.file.dataDirectory + "jsons_Siniestros/Asignaciones_" + empresa + ".json", function (data) {
                    let content2 = JSON.parse(data);
                    for (let x = 0; x < content2.length; x++) {
                        if (content2[x].Chasis == Chasis && content2[x].FK_formato == FKFormato) {
                            optionsVistas += `
                            <option 
                                value="${content2[x].ID}" 
                                attr_RutaImg="${content2[x].NombreImg}"
                                attr_IDAsignacion="${content2[x].ID}"
                                attr_IDVistas="${content2[x].IDVistas}"
                            >
                                ${content2[x].PARTE_DE_LA_UNIDAD}
                            </option>`;
                            encontro = true;
                        }
                    }
                    $("#selectVistas").html(optionsVistas);
                });

                $("#selectVistas").change(() => {
                    if ($("#selectVistas").find("option:selected").attr("attr_RutaImg") == "null") {
                        swal("", "No hay vista que traer.", "warning");
                        if (zoomist) {
                            zoomist.destroy();
                            $("#bodyHtml").html("");
                        }
                        return false;
                    }

                    let nameImg = $("#selectVistas").find("option:selected").attr("attr_RutaImg");
                    let ruta = cordova.file.dataDirectory + "jsons_Siniestros/" + nameImg;
                    let IDAsignacion = $("#selectVistas").find("option:selected").attr("attr_IDAsignacion");
                    let IDVistas = $("#selectVistas").find("option:selected").attr("attr_IDVistas");
                    let html = "";

                    app.request.get(cordova.file.dataDirectory + "jsons_Siniestros/DetallesFormatos2_" + empresa + ".json", function (data) {
                        let content2 = JSON.parse(data);
                        for (let x = 0; x < content2.length; x++) {
                            if (content2[x].FK_RelacionAsignacion == IDAsignacion && content2[x].FK_Vista == IDVistas) {
                                console.log(content2[x]);
                                if (content2[x].type_val == "circle") {
                                    html += `
                                    <a xlink:href="#" xlink:title="" 
                                        onclick="verConceptoSiniestro(
                                            ${content2[x].FK_RelacionAsignacion},
                                            ${content2[x].FK_Vista},
                                            ${content2[x].FK_Concepto}
                                        )">
                                        <g>
                                            <circle
                                                cx="${content2[x].cx_val}"
                                                cy="${content2[x].cy_val}"
                                                r="${content2[x].r_val}"
                                                class="image-mapper-shape"
                                                data-index="${content2[x].index_val}"
                                                onclick="return false;"
                                            ></circle>
                                        </g>
                                    </a>`;
                                } else if (content2[x].type_val == "rectangulo") {
                                    html += `
                                    <a xlink:href="#" xlink:title="" 
                                        onclick="verConceptoSiniestro(
                                            ${content2[x].FK_RelacionAsignacion},
                                            ${content2[x].FK_Vista},
                                            ${content2[x].FK_Concepto}
                                        )">
                                        <g>
                                            <rect
                                                x="${content2[x].x_val}"
                                                y="${content2[x].y_val}"
                                                width="${content2[x].width}"
                                                height="${content2[x].height}"
                                                class="image-mapper-shape"
                                                data-index="${content2[x].index_val}"
                                                onclick="return false;"
                                            ></rect>
                                        </g>
                                    </a>`;
                                }

                                encontro2 = true;
                            }
                        }

                        $("#bodyHtml").html(

                                <div class="col-75">
                                    <div class="col p-2 d-flex justify-content-center">
                                        <div class="zoomist-container">
                                            <div class="zoomist-wrapper">
                                                <div class="zoomist-image">
                                                    <!-- Image Map Generated by https://www.fla-shop.com/image-map/ -->
                                                    <svg style="width: 100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" id="svg_img">
                                                        <image
                                                            xlink:href="${ruta}"
                                                            style="width: 1920px"
                                                        ></image>
                                                        ${html}
                                                    </svg>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                <div class="col-25" style="text-align: center;">

                                    value="${

                                            ? document.documentElement.style.getPropertyValue("--color")
                                            : "#ff0000"
                                    }" style="min-height: 40px;min-width: 50px;">
                                </div>
                            </div>`
